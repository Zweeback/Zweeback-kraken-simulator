name: Current visual status

on:
  push:
    branches: ["infra/current-visual-status"]
    paths:
      - "docs/status/current.json"
      - ".github/workflows/current-visual-status.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Render honest status evidence
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import json, textwrap

          root = Path("docs/status")
          data = json.loads((root / "current.json").read_text())
          accent = data["accent"]
          image = Image.new("RGB", (1600, 900), "#0b1020")
          draw = ImageDraw.Draw(image)
          regular = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          bold = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          font = lambda size, strong=False: ImageFont.truetype(bold if strong else regular, size)
          draw.rectangle((0, 0, 1600, 16), fill=accent)
          draw.text((104, 86), "CURRENT VISUAL STATUS", font=font(28, True), fill=accent)
          draw.text((104, 150), data["project"], font=font(66, True), fill="#f8fafc")
          draw.rounded_rectangle((104, 252, 104 + max(260, 24 * len(data["stage"])), 308), 18, fill="#182033")
          draw.text((132, 266), data["stage"], font=font(24, True), fill="#cbd5e1")
          draw.text((104, 374), "NO RUNNABLE VISUAL YET", font=font(48, True), fill="#f8fafc")
          draw.multiline_text((104, 446), "This repository currently contains product direction or recovery inputs,\nnot an executable screen. This image is status evidence — not concept art.", font=font(27), fill="#94a3b8", spacing=14)
          draw.text((104, 590), "NEXT ACCEPTANCE GATE", font=font(23, True), fill=accent)
          y = 638
          for line in textwrap.wrap(data["next_acceptance_gate"], 68):
              draw.text((104, y), line, font=font(34, True), fill="#e2e8f0")
              y += 48
          draw.line((104, 800, 1496, 800), fill="#263249", width=2)
          draw.text((104, 828), "STATUS EVIDENCE · NOT A RUNTIME SCREENSHOT", font=font(20, True), fill="#64748b")
          image.save(root / "current.png", optimize=True)
      - name: Commit status image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/status/current.png
          git diff --cached --quiet || git commit -m "docs: refresh current visual status"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: current-visual-status
          path: docs/status/current.png
